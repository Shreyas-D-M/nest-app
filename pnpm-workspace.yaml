packages:
  - 'apps/admin-web'
  - 'apps/api'
  - 'packages/*'

# Expo's pnpm monorepo layout expects a hoisted tree so Metro can resolve the
# shared React Native dependencies without duplicate native modules.
nodeLinker: hoisted

# Workspace packages are always linked from the workspace, never the registry.
linkWorkspacePackages: true
preferWorkspacePackages: true

# The React Native / Expo dependency graph declares many loose or missing peers.
# Failing the install on those would block the whole workspace.
strictPeerDependencies: false

# pnpm blocks dependency lifecycle scripts by default. Only the packages listed
# here may run install scripts — every entry is code executing at install time,
# so each one is deliberate:
#   prisma / @prisma/engines — download the platform query engine binaries that
#     the Prisma CLI and client require.
#   unrs-resolver — native module resolver used by the ESLint TypeScript
#     tooling; without its build step, resolution falls back and lint slows.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true
  unrs-resolver: true

# Added automatically by pnpm's supply-chain minimum-release-age policy.
minimumReleaseAgeExclude:
  - '@nestjs/jwt@11.0.2'
  - eslint@10.9.0
  - '@next/env@16.3.2'
  - '@next/swc-darwin-arm64@16.3.2'
  - '@next/swc-darwin-x64@16.3.2'
  - '@next/swc-linux-arm64-gnu@16.3.2'
  - '@next/swc-linux-arm64-musl@16.3.2'
  - '@next/swc-linux-x64-gnu@16.3.2'
  - '@next/swc-linux-x64-musl@16.3.2'
  - '@next/swc-win32-arm64-msvc@16.3.2'
  - '@next/swc-win32-x64-msvc@16.3.2'
  - next@16.3.2

# Avoid forcing a single React version across the workspace. Each app must resolve
# the version that matches its own Expo/React Native stack; root-wide overrides
# here create the cross-app mismatch that breaks Metro and Expo exports.
